name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '22'
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca_test
          POSTGRES_PASSWORD: biblioteca_test_password
          POSTGRES_DB: biblioteca_estudos_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U biblioteca_test -d biblioteca_estudos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: ${{ env.BACKEND_DIR }}
        run: npx prisma generate

      - name: Executar lint do backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run lint

      - name: Executar testes unitários do backend
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://biblioteca_test:biblioteca_test_password@localhost:5432/biblioteca_estudos_test
          JWT_SECRET: ci-test-secret-do-not-use-in-production-min-32-bytes
          FRONTEND_URL: http://localhost:3001
          PORT: 3000
        run: npm test

      - name: Executar testes e2e do backend
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://biblioteca_test:biblioteca_test_password@localhost:5432/biblioteca_estudos_test
          JWT_SECRET: ci-test-secret-do-not-use-in-production-min-32-bytes
          FRONTEND_URL: http://localhost:3001
          PORT: 3000
        run: npm run test:e2e

      - name: Build de produção do backend
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://biblioteca_test:biblioteca_test_password@localhost:5432/biblioteca_estudos_test
          JWT_SECRET: ci-test-secret-do-not-use-in-production-min-32-bytes
        run: |
          npx prisma generate
          npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Executar lint do frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Build de produção do frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STORAGE_URL: http://localhost:9000/biblioteca-estudos
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Dockerfile do backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: docker build --target builder -t biblioteca-backend-build .
